version: 2
updates:
  # Bun dependencies
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    labels: ["dependencies", "javascript"]
    open-pull-requests-limit: 3
    groups:
      js-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(js)"
      include: "scope"
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(actions)"
      include: "scope"