symbolPreset: nerd
theme:
  light: light
setupVersion: 2
extensions:
  - ~/.omp/agent/extensions/agent-introspection-activity.ts
  - ~/.omp/agent/extensions/enable-command-centre.ts
  - ~/.omp/agent/extensions/analyse.ts
  - ~/.omp/agent/extensions/agent-autocomplete.ts
  - ~/.omp/agent/extensions/codex-quota-gate.ts
  - ~/.omp/agent/extensions/jev-watchdog.ts
  - ~/.omp/agent/extensions/jev-guard.ts
  - ~/.omp/agent/extensions/jev-ask.ts
modelRoles:
  plan: anthropic/claude-opus-5-5:medium
  slow: anthropic/claude-opus-5-5:medium
  smol: openai-codex/gpt-6-luna:low
  task: anthropic/claude-sonnet-5-5:low
  tiny: openai-codex/gpt-6-luna:low
  designer: anthropic/claude-sonnet-5-5:medium
  advisor: openai-codex/gpt-6-astra:low
  commit: openai-codex/gpt-6-luna:low
  vision: openai-codex/gpt-6.1-sol:low
  completionist: openai-codex/gpt-6.1-sol:low
  innovation-council: anthropic/claude-opus-5-5:high
  innovation-challenger: openai-codex/gpt-6-astra:high
  experiment-design: anthropic/claude-fable-5-1:high
  experiment-peer: anthropic/claude-opus-5-5:high
  plan-judge: openai-codex/gpt-6.1-sol:low
  reviewer: openai-codex/gpt-6.1-sol:low
  test-judge: openai-codex/gpt-6.1-sol:low
  kiss: openai-codex/gpt-6.1-sol:low
  operator: openai-codex/gpt-6.1-sol:low
  web: openai-codex/gpt-6-luna
  default: anthropic/claude-opus-5-5:medium
advisor:
  enabled: true
  syncBacklog: "1"
  immuneTurns: 3
dev:
  autoqaConsent: granted
textVerbosity: low
disabledProviders:
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents-md
skills:
  customDirectories:
    - ~/.agents/skills
    - ~/.agents/by-request
    - ~/.omp/agent/skills
edit:
  enforceSeenLines: true
lsp:
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
task:
  isolation:
    enabled: true
  enableLsp: true
  agentAdvisor:
    task: "on"
  agentServiceTierOverrides:
    sonic: priority
  agentModelOverrides:
    reviewer: "@reviewer"
checkpoint:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: false
  autoContinue: false
defaultThinkingLevel: medium
extendedContext: false
compaction:
  enabled: true
  handoffSaveToDisk: true
  methodOrder:
    - handoff
  thresholdPercent: 50
composer:
  shape: box
isolation:
  backend: auto
codexResets:
  autoRedeem: "yes"
retry:
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6-luna
      - xai-oauth/grok-4.5
      - web/ollama