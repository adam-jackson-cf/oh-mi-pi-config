symbolPreset: nerd
theme:
  dark: orca-sections-dark
  light: orca-sections-light
setupVersion: 3
extensions:
  - ~/.omp/agent/extensions/analyse.ts
  - ~/.omp/agent/extensions/agent-autocomplete.ts
  - ~/.omp/agent/extensions/quota-gate.ts
  - ~/.omp/agent/extensions/agent-rails
  - ~/.omp/agent/extensions/agy-cli.ts
modelRoles:
  plan: anthropic/claude-opus-5-5:medium
  slow: anthropic/claude-opus-5-5:medium
  smol: openai-codex/gpt-6-luna:low
  task: anthropic/claude-haiku-5-5:high
  tiny: openai-codex/gpt-6-luna:low
  designer: anthropic/claude-sonnet-5-5:medium
  commit: openai-codex/gpt-6-luna:low
  vision: openai-codex/gpt-6.1-terra:low
  innovation-council: anthropic/claude-fable-5-2:high
  innovation-challenger: openai-codex/gpt-6-astra:high
  innovation-gemini-challenger: agy/gemini-4-neon:high
  experiment-design: anthropic/claude-fable-5-2:high
  experiment-peer: anthropic/claude-opus-5-5:high
  reviewer: openai-codex/gpt-6.1-sol:medium
  kiss: openai-codex/gpt-6.1-sol:low
  operator: openai-codex/gpt-6.1-terra:off
  web: openai-codex/gpt-6-luna
  judge: typesafe/jev-1.14.0
  default: anthropic/claude-opus-5-5:medium
textVerbosity: low
disabledProviders:
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents-md
skills:
  customDirectories:
    - ~/.agents/skills
    - ~/.agents/by-request
    - ~/.omp/agent/skills
edit:
  enforceSeenLines: true
lsp:
  diagnosticsOnEdit: true
bash:
  gitGuard: true
commit:
  enabled: false
worktree:
  base: ~/worktrees
task:
  isolation:
    enabled: true
  enableLsp: true
  agentServiceTierOverrides:
    sonic: priority
    task: priority
    kiss: priority
  agentModelOverrides:
    reviewer: "@reviewer"
    scout: anthropic/claude-haiku-5-5:medium
  perCallModel: "on"
find:
  enabled: "on"
session:
  warnCost: 150
checkpoint:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: false
  autoContinue: false
defaultThinkingLevel: medium
extendedContext: false
compaction:
  enabled: true
  handoffSaveToDisk: true
  methodOrder:
    - handoff
    - shake
  thresholdPercent: 50
composer:
  shape: box
isolation:
  backend: auto
codexResets:
  autoRedeem: "yes"
retry:
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6-luna
      - xai-oauth/grok-4.5
      - web/ollama
update:
  auto: false
dev:
  autoqaConsent: denied
