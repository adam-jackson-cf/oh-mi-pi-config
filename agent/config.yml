symbolPreset: nerd
theme:
  light: light
setupVersion: 2
extensions:
  - ~/.omp/agent/extensions/enable-command-centre.ts
  - ~/.omp/agent/extensions/analyse.ts
  - ~/.omp/agent/extensions/agent-autocomplete.ts
  - ~/.omp/agent/extensions/codex-quota-gate.ts
  - ~/.omp/agent/extensions/jev-watchdog.ts
modelRoles:
  plan: openai-codex/gpt-5.6-sol:off
  slow: openai-codex/gpt-5.6-terra:high
  smol: openai-codex/gpt-5.4-mini:low
  task: openai-codex/gpt-5.6-terra:high
  tiny: openai-codex/gpt-5.6-luna:low
  designer: openai-codex/gpt-6-astra:off
  advisor: openai-codex/gpt-6-sol:off
  commit: openai-codex/gpt-5.4-mini:low
  vision: openai-codex/gpt-5.6-terra:medium
  completionist: openai-codex/gpt-5.6-terra:high
  innovation-council: openai-codex/gpt-6-astra:medium
  innovation-fable: anthropic/claude-fable-5.1:medium
  plan-judge: openai-codex/gpt-5.6-terra:high
  reviewer: openai-codex/gpt-5.6-terra:high
  test-judge: openai-codex/gpt-5.6-terra:high
  kiss: openaai-code/gpt-5.6-terr:high
  web: openai-codex/gpt-5.6-luna
  default: openai-codex/gpt-6-sol:off
advisor:
  enabled: true
  syncBacklog: "1"
  immuneTurns: 3
dev:
  autoqaConsent: granted
textVerbosity: low
disabledProviders:
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents-md
skills:
  customDirectories:
    - ~/.agents/skills
    - ~/.agents/by-request
    - ~/.omp/agent/skills
edit:
  enforceSeenLines: true
lsp:
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
task:
  isolation:
    enabled: true
  enableLsp: true
  agentAdvisor:
    task: "off"
checkpoint:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: false
  autoContinue: false
defaultThinkingLevel: auto
extendedContext: false
compaction:
  enabled: true
  handoffSaveToDisk: true
  methodOrder:
    - handoff
  thresholdPercent: 50
composer:
  shape: box
isolation:
  backend: auto
codexResets:
  autoRedeem: "yes"
retry:
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama