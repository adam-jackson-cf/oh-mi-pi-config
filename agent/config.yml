symbolPreset: nerd
theme:
  light: light
setupVersion: 2
extensions:
  - ~/.omp/agent/extensions/analyse.ts
  - ~/.omp/agent/extensions/agent-autocomplete.ts
modelRoles:
  default: openai-codex/gpt-5.6-sol:off
  plan: openai-codex/gpt-5.6-sol:low
  slow: openai-codex/gpt-5.6-terra:high
  smol: openai-codex/gpt-5.4-mini:low
  task: openai-codex/gpt-5.6-terra:low
  tiny: openai-codex/gpt-5.6-luna:low
  designer: openai-codex/gpt-5.6-sol:low
  advisor: openai-codex/gpt-5.6-sol:low
  commit: openai-codex/gpt-5.4-mini:low
  vision: openai-codex/gpt-5.6-terra:medium
  completionist: openai-codex/gpt-5.6-terra:high
  innovation-council: openai-codex/gpt-5.6-sol:low
  innovation-fable: anthropic/claude-fable-5:high
  plan-judge: openai-codex/gpt-5.6-terra:high
  reviewer: openai-codex/gpt-5.6-terra:high
  test-judge: openai-codex/gpt-5.6-terra:high
advisor:
  enabled: true
  syncBacklog: "1"
  immuneTurns: 3
providers:
  webSearchOrder:
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
dev:
  autoqaConsent: granted
textVerbosity: low
disabledProviders:
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents
  - agents-md
skills:
  customDirectories:
    - ~/.agents/skills
edit:
  enforceSeenLines: true
lsp:
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
task:
  isolation:
    mode: auto
  enableLsp: true
  agentAdvisor:
    task: "off"
checkpoint:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: false
defaultThinkingLevel: low
extendedContext: false
compaction:
  enabled: true
  handoffSaveToDisk: true
  methodOrder:
    - handoff
  thresholdPercent: 50
composer:
  shape: box