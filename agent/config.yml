symbolPreset: nerd
theme:
  light: light
setupVersion: 1
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-5.6-sol:medium
  slow: openai-codex/gpt-5.6-terra:high
  smol: openai-codex/gpt-5.4-mini:low
  task: openai-codex/gpt-5.6-terra:low
  tiny: openai-codex/gpt-5.6-luna:low
  designer: openai-codex/gpt-5.6-terra:medium
  advisor: openai-codex/gpt-5.6-sol:high
  slateResearch: openai-codex/gpt-5.6-sol:high
  slateGoal: openai-codex/gpt-5.6-sol:high
  slateProgramDesign: openai-codex/gpt-5.6-sol:high
  commit: openai-codex/gpt-5.4-mini:low
  vision: openai-codex/gpt-5.6-terra:medium
advisor:
  enabled: false
  syncBacklog: "1"
  immuneTurns: 3
providers:
  webSearchOrder:
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
dev:
  autoqaConsent: granted
textVerbosity: low
disabledProviders:
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents
  - agents-md
skills:
  customDirectories:
    - ~/.agents/skills
edit:
  enforceSeenLines: true
lsp:
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
task:
  isolation:
    mode: auto
  enableLsp: true
  agentAdvisor:
    task: "off"
checkpoint:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: false
defaultThinkingLevel: auto
compaction:
  enabled: true
  handoffSaveToDisk: true
  strategy: handoff
  thresholdPercent: 40