[mypy]
# Per-target: set python_version to the supported Python version.
strict = True
warn_unused_ignores = True
follow_imports = skip
# Per-target: set mypy_path to every maintained import root.
# Per-target: set packages to every maintained package; detect inventory drift.
show_error_codes = True
# Per-target: exclude only documented non-maintained paths.
# Per-target: add named module override sections only with missing-stub or
# decorator evidence; do not introduce global missing-import exceptions.
