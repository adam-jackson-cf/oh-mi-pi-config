{
  "id": "TEST.no-test-hooks",
  "language": "python",
  "scope": "production",
  "message": "production code reads a test marker from the environment or loaded modules ({match})",
  "fix": "remove the test-only branch; tests must exercise the production path unchanged",
  "rule": {
    "kind": "string",
    "regex": "^[rRbBuU]*['\"]([A-Z0-9_]*_)?(PYTEST[A-Z0-9_]*|TESTING|TEST_MODE|UNDER_TEST|TESTS?)(_[A-Z0-9_]*)?['\"]$|^[rRbBuU]*['\"](pytest|unittest)['\"]$",
    "any": [
      {"inside": {"kind": "argument_list", "inside": {"kind": "call", "has": {"field": "function", "regex": "(^|\\.)(getenv|environ\\.(get|pop|setdefault)|modules\\.get)$"}}}},
      {"inside": {"kind": "subscript", "has": {"field": "value", "regex": "(^|\\.)(environ|modules)$"}}},
      {"inside": {"kind": "comparison_operator", "has": {"kind": "attribute", "regex": "(^|\\.)(environ|modules)$"}}}
    ]
  }
}
