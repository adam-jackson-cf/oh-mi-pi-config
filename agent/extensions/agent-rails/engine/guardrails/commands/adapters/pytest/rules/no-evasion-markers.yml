{
  "id": "TEST.no-evasion",
  "language": "python",
  "scope": "tests",
  "message": "test skips, expects failure or retries instead of passing ({match})",
  "remediation": {
    "root_cause": "A skip, expected-failure or retry marker lets a failing or flaky test count as handled instead of fixed.",
    "fix": "Remove the marker and fix the code or test so it passes on every required run; record a reason-backed exceptions entry only for an external outage."
  },
  "rule": {
    "any": [
      {
        "kind": "decorator",
        "regex": "^@\\s*((pytest\\.)?mark\\.(skip|skipif|xfail|flaky)|(unittest\\.)?(skip|skipIf|skipUnless|expectedFailure)|flaky)\\b"
      },
      {
        "kind": "call",
        "has": {
          "field": "function",
          "regex": "^(pytest\\.(skip|xfail|importorskip)|self\\.skipTest)$"
        }
      },
      {
        "kind": "assignment",
        "regex": "^pytestmark\\s*=[\\s\\S]*mark\\.(skip|skipif|xfail|flaky)\\b"
      }
    ]
  }
}
