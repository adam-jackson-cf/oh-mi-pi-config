{
  "id": "TEST.no-self-mocking",
  "language": "python",
  "scope": "tests",
  "target": "assigned-attribute-object",
  "message": "test replaces an attribute of the repo's own code ({target})",
  "remediation": {
    "root_cause": "The test rebinds an attribute of owned code, so it checks the replacement rather than the code that ships.",
    "fix": "Drive the behaviour through the declared public entry point and give the owned dependency an interface the test can pass a real or fake implementation through."
  },
  "rule": {
    "kind": "assignment",
    "has": {
      "field": "left",
      "kind": "attribute"
    }
  }
}
