{
  "id": "TEST.no-self-mocking",
  "language": "python",
  "scope": "tests",
  "target": "first-argument",
  "message": "test patches or mocks the repo's own code ({target})",
  "remediation": {
    "root_cause": "The test patches owned code because the code under test reaches its collaborator directly instead of receiving it.",
    "fix": "Inject the collaborator through an owned interface, fake only third-party or OS boundaries, and call the public entry point unchanged."
  },
  "rule": {
    "kind": "call",
    "has": {
      "field": "function",
      "regex": "(^|\\.)(patch|patch\\.object|patch\\.dict|patch\\.multiple|setattr|delattr|create_autospec)$"
    }
  }
}
