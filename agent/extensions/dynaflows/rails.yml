editTools: [write, edit, ast_edit]
# Applied to parsed command positions after env assignments and git global options, in both modes.
# Quoted echo/rg arguments are not commands and do not trigger this check. Every Git and GitHub
# write needs the read: commit, push, merge, rebase, reset, cherry-pick, tag, branch deletion,
# worktree add/remove, branch creation, gh pr create/merge/edit/close and gh api writes.
gitCommand: '^(git (commit|push|merge|rebase|reset|cherry-pick)(?![-\w])|git tag (?!(?:-l|--list|-n\d*|--contains|--no-contains|--points-at|--merged|--no-merged|--sort\S*|--format\S*|-v|--verify)(?:[ =]|$))\S|git branch (?:.* )?(?:-d|-D|--delete)(?: |$)|git worktree (add|remove)\b|git switch (?:.* )?(?:-c|-C|--create)(?:[ =]|$)|git checkout (?:.* )?(?:-b|-B)(?: |$)|gh pr (create|merge|edit|close)\b|gh api\b(?=.* (?:(?:-X ?|--method[ =])(?!(?:GET|HEAD|get|head)\b)\S|(?:-f|-F|--field|--raw-field|--input)(?:[ =]|$))))'
# Structured mode: a command part matching this asks in-scope before it runs (privileges,
# credentials, installs, other machines); yes or escalate needs the owner's $approve line.
askFirstCommand: '^(?:sudo|su|doas|ssh|scp|rsync|gh auth|gh secret|infisical (?:login|secrets set)|op signin|npm (?:i|install|add) (?:.* )?(?:-g|--global)|bun (?:add|install|i) (?:.* )?(?:-g|--global)|pnpm (?:add|install) (?:.* )?(?:-g|--global)|uv tool install|pipx install|pip3? install|brew (?:install|upgrade|tap)|apt(?:-get)? install|tailscale|launchctl|systemctl)(?:\s|$)'
pathFields:
  read: [path]
  write: [path]
  edit: [path, paths]
  ast_edit: [paths]
  find: [path]
  grep: [path]
  glob: [path]
  ast_grep: [paths]
resolveDevice: xd://resolve
rejectDevice: xd://reject
