{
  "id": "TEST.no-self-mocking",
  "language": "python",
  "scope": "tests",
  "target": "keyword:spec,spec_set",
  "message": "test builds a mock of the repo's own code ({target})",
  "remediation": {
    "root_cause": "The test builds a mock specced on owned code, which copies the owned interface instead of exercising it.",
    "fix": "Use the real owned object through the public entry point and fake only third-party or OS boundaries behind owned interfaces."
  },
  "rule": {
    "kind": "call",
    "has": {
      "field": "function",
      "regex": "(^|\\.)(Mock|MagicMock|AsyncMock|NonCallableMock|NonCallableMagicMock)$"
    }
  }
}
