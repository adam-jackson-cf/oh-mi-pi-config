{
  "id": "TEST.no-test-hooks",
  "language": "python",
  "scope": "production",
  "message": "production code declares a test-only hook ({match})",
  "remediation": {
    "root_cause": "Production code declares a hook named for tests, which exists only to let tests reach inside.",
    "fix": "Remove the hook and drive the behaviour through the public entry point, exposing a real production input where tests need control."
  },
  "rule": {
    "kind": "identifier",
    "regex": "(?i)(^|_)(for_tests?|for_testing|test_hooks?|testing_only|test_only|test_mode)$"
  }
}
