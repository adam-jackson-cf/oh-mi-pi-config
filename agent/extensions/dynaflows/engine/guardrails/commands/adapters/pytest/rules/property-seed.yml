{
  "id": "TEST.property-seed",
  "language": "python",
  "scope": "tests",
  "message": "Hypothesis property test neither fixes nor reports its seed ({match})",
  "remediation": {
    "root_cause": "The Hypothesis property test runs with a seed that is neither fixed nor reported, so a failure cannot be replayed.",
    "fix": "Fix or report the seed for every property test through a shared Hypothesis settings profile: @seed, print_blob=True or derandomize=True."
  },
  "rule": {
    "kind": "decorated_definition",
    "has": {
      "kind": "decorator",
      "regex": "^@\\s*(hypothesis\\.)?given\\b"
    },
    "not": {
      "has": {
        "kind": "decorator",
        "regex": "^@\\s*(hypothesis\\.)?seed\\b|print_blob\\s*=\\s*True|derandomize\\s*=\\s*True"
      }
    }
  }
}
